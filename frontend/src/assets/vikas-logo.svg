<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22a8b0"/>
      <stop offset="0.35" stop-color="#2563eb"/>
      <stop offset="0.7" stop-color="#d12f7a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22a8b0"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- rounded badge -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#brand)"/>

  <!-- two stylised figures forming a heart / unity -->
  <g fill="#ffffff">
    <!-- left figure -->
    <circle cx="48" cy="50" r="9.5"/>
    <path d="M34 86c0-12 6-20 14-20s14 8 14 20v4H34v-4z"/>
    <!-- right figure -->
    <circle cx="80" cy="50" r="9.5"/>
    <path d="M66 86c0-12 6-20 14-20s14 8 14 20v4H66v-4z"/>
    <!-- joined hands arc above -->
    <path d="M48 41c10-10 22-10 32 0l-3 4c-9-8-17-8-26 0l-3-4z" opacity="0.95"/>
  </g>

  <!-- uplift spark -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M64 22l2.6 6.4 6.4 2.6-6.4 2.6L64 40l-2.6-6.4L55 31l6.4-2.6L64 22z"/>
  </g>
</svg>